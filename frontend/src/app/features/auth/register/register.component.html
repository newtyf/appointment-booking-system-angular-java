<div class="flex items-center justify-center min-h-screen bg-pink-100">
  <div class="bg-white p-10 rounded-lg shadow-2xl w-full max-w-3xl mx-4 md:mx-auto flex flex-col md:flex-row items-center md:space-x-12">
    <div class="mb-8 md:mb-0">
      <img
        src="/assets/monarcaLogo.png"
        alt="Monarca Logo"
        class="w-64 h-64 object-contain"
      />
    </div>

    <div class="w-full md:w-auto flex-grow">
      <div class="flex flex-col items-center mb-8">
        <h2 class="text-4xl font-extrabold text-gray-900 mb-2 text-center">Registrarse</h2>
        <p class="text-base text-gray-600 text-center">Cree su cuenta para comenzar</p>
      </div>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-6">
        <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
          <span class="block sm:inline">{{ errorMessage }}</span>
        </div>

        <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
          <span class="block sm:inline">{{ successMessage }}</span>
        </div>

        <!-- Campo Nombre -->
        <div>
          <label for="nombre" class="sr-only">Nombre</label>
          <div class="relative rounded-md shadow-sm">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 8a3 3 0 100-6 3 3 0 000 6zM3.465 14.493a1.23 1.23 0 00.41 1.412A9.957 9.957 0 0010 18c2.31 0 4.438-.784 6.131-2.1.43-.333.604-.903.408-1.41a7.002 7.002 0 00-13.074.003z" />
              </svg>
            </div>
            <input
              id="nombre"
              name="name"
              type="text"
              autoComplete="name"
              required
              [(ngModel)]="form.name"
              class="block w-full rounded-md border-0 py-2 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-pink-600 sm:text-sm sm:leading-6"
              placeholder="Ingrese su nombre completo"
            />
          </div>
        </div>

        <!-- Campo Email -->
        <div>
          <label for="email" class="sr-only">Correo Electrónico</label>
          <div class="relative rounded-md shadow-sm">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0018 4H2a2 2 0 00-.003 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input
              id="email"
              name="email"
              type="email"
              autoComplete="email"
              required
              [(ngModel)]="form.email"
              email
              class="block w-full rounded-md border-0 py-2 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-pink-600 sm:text-sm sm:leading-6"
              placeholder="Ingrese su correo electrónico"
            />
          </div>
        </div>

        <!-- Campo Teléfono -->
        <div>
          <label for="telefono" class="sr-only">Teléfono</label>
          <div class="relative rounded-md shadow-sm">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106a1.125 1.125 0 01-.622-1.077V11.25a.75.75 0 01.75-.75h2.25c.621 0 1.125-.504 1.125-1.125V9C22.5 8.379 21.996 7.875 21.375 7.875H19.5a2.25 2.25 0 00-2.25 2.25v1.5m-8.114-10.372C11.167 4.49 13.511 4.5 15.75 4.5c1.155 0 2.308-.023 3.456-.068" />
              </svg>
            </div>
            <input
              id="telefono"
              name="phone"
              type="tel"
              autoComplete="tel"
              required
              [(ngModel)]="form.phone"
              class="block w-full rounded-md border-0 py-2 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-pink-600 sm:text-sm sm:leading-6"
              placeholder="Ingrese su teléfono"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label for="password" class="sr-only">Contraseña</label>
          <div class="relative rounded-md shadow-sm">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fillRule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clipRule="evenodd" />
              </svg>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              autoComplete="new-password"
              required
              [(ngModel)]="form.password"
              minlength="6"
              class="block w-full rounded-md border-0 py-2 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-pink-600 sm:text-sm sm:leading-6"
              placeholder="Ingrese su contraseña"
            />
          </div>
        </div>

        <!-- Campo Confirmar Contraseña -->
        <div>
          <label for="confirmPassword" class="sr-only">Confirmar Contraseña</label>
          <div class="relative rounded-md shadow-sm">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fillRule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clipRule="evenodd" />
              </svg>
            </div>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autoComplete="new-password"
              required
              [(ngModel)]="confirmPassword"
              class="block w-full rounded-md border-0 py-2 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-pink-600 sm:text-sm sm:leading-6"
              placeholder="Confirme su contraseña"
            />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="loading || !registerForm.valid"
          class="cursor-pointer w-full px-4 py-2 bg-pink-600 text-white rounded hover:bg-pink-700 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ loading ? 'Registrando...' : 'Registrarme' }}
        </button>

        <p class="mt-4 text-center text-sm text-gray-600">
          ¿Ya tienes una cuenta?
          <a routerLink="/auth/login" class="font-semibold leading-6 text-pink-600 hover:text-pink-500">
            Inicia sesión aquí
          </a>
        </p>
      </form>
    </div>
  </div>
</div>
