# Application Name
spring.application.name=monarca-appointments

# DataSource Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_DB_HOST:localhost}:${MYSQL_DB_PORT:3306}/${MYSQL_DB_NAME:appointments_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_DB_USER:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# JWT Configuration
jwt.secret=${SECRET_KEY:your-secret-key-min-32-chars-long-for-hs256-algorithm}
jwt.algorithm=HS256
jwt.expiration=${ACCESS_TOKEN_EXPIRE_MINUTES:1440}

# Culqi Payment Gateway
culqi.api-url=${CULQI_API_URL:https://api.culqi.com/v2}
culqi.secret-key=${CULQI_SECRET_KEY:}

# Replicate AI
replicate.api-token=${REPLICATE_API_TOKEN:}

# Email Configuration
spring.mail.host=${SMTP_SERVER:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${EMAIL_SENDER:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}

# Environment
app.environment=${ENVIRONMENT:development}
app.api-prefix=${API_PREFIX:/api}

# Jackson Configuration (for entity serialization)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
